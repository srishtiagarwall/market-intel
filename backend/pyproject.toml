[tool.poetry]
name = "market-intel-backend"
version = "0.1.0"
description = "Personalised Market Intelligence Tool — Backend"
authors = ["Srishti"]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }

# Database
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"

# Cache
redis = { extras = ["asyncio"], version = "^5.0.4" }

# Data fetching
yfinance = "^0.2.38"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
lxml = "^5.2.2"

# Signal computation
pandas = "^2.2.2"
numpy = "^1.26.4"
pandas-ta = "^0.3.14b"

# NLP / sentiment
transformers = "^4.41.0"

# PDF parsing (CAMS)
pdfplumber = "^0.11.0"

# Scheduling
apscheduler = "^3.10.4"

# Notifications
python-telegram-bot = "^21.3"

# Config
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"

# Validation
pydantic = "^2.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"
black = "^24.4.2"
ruff = "^0.4.4"
mypy = "^1.10.0"

[tool.poetry.group.backtest.dependencies]
plotly = "^5.22.0"
scipy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
